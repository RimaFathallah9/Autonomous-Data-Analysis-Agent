# Dataset registry = single source of truth for every dataset the project touches.
# Rule: a dataset that is not listed here (with a license) is not allowed in an experiment.
#
# loader formats:
#   sklearn:<fn>        -> bundled with scikit-learn (no network, deterministic)
#   synthetic:<kind>    -> generated here with a fixed seed (license: CC0, we made it)
#   url:csv             -> downloaded to data/raw/, verified against `sha256`
#
# sha256 is null for remote files until you "pin" them:  ada fetch <name>
# (trust-on-first-use: the first download prints the hash, you paste it here, and from
#  then on any silent upstream change makes the loader fail loudly.)

datasets:
  - name: wine
    loader: "sklearn:load_wine"
    kind: tabular
    target_col: target
    license: "CC BY 4.0 (UCI ML Repository, Wine dataset)"
    source: "https://archive.ics.uci.edu/dataset/109/wine"
    has_labels: true
    redistribution_allowed: true
    task_tags: [cleaning_base, row_anomaly]
    description: "178 rows, 13 numeric chemical measurements, 3 cultivars."

  - name: breast_cancer_wdbc
    loader: "sklearn:load_breast_cancer"
    kind: tabular
    target_col: target
    license: "CC BY 4.0 (UCI ML Repository, Breast Cancer Wisconsin Diagnostic)"
    source: "https://archive.ics.uci.edu/dataset/17"
    has_labels: true
    redistribution_allowed: true
    task_tags: [cleaning_base, row_anomaly]
    description: "569 rows, 30 numeric features. Target 1=benign, 0=malignant."

  - name: synthetic_tabular
    loader: "synthetic:tabular"
    kind: tabular
    target_col: target
    license: "CC0 (generated by this repo, seed=0)"
    source: "src/ada/datasets/synthetic.py"
    has_labels: true
    redistribution_allowed: true
    task_tags: [cleaning_base]
    description: "1000 rows, 5 correlated numeric features + 1 categorical (segment), binary target."

  - name: synthetic_timeseries
    loader: "synthetic:timeseries"
    kind: timeseries
    license: "CC0 (generated by this repo, seed=0)"
    source: "src/ada/datasets/synthetic.py"
    has_labels: false
    redistribution_allowed: true
    task_tags: [ts_anomaly]
    description: "2000 hourly points: daily seasonality + slow trend + noise. Anomalies are injected per-seed."

  # Optional remote dataset (needs network). Not used by experiments/default.yaml.
  # Verify the license on the source page before redistributing anything.
  - name: uci_adult
    loader: "url:csv"
    kind: tabular
    target_col: income
    url: "https://archive.ics.uci.edu/ml/machine-learning-databases/adult/adult.data"
    sha256: null
    csv_options:
      header: null
      skipinitialspace: true
      names: [age, workclass, fnlwgt, education, education-num, marital-status, occupation,
              relationship, race, sex, capital-gain, capital-loss, hours-per-week,
              native-country, income]
    license: "CC BY 4.0 (UCI ML Repository, Adult)"
    source: "https://archive.ics.uci.edu/dataset/2/adult"
    has_labels: true
    redistribution_allowed: false   # we do not commit it; we download it
    task_tags: [cleaning_base]
    description: "~32k rows, mixed numeric/categorical. Contains natural '?' missing markers."
